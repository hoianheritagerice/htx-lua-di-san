name: Clear stuck GitHub Pages deployment
on:
  push:
    branches: [ops/pages-recovery-207bbeb]
    paths: [.github/workflows/recover-pages.yml]
permissions: {}
jobs:
  cancel-stuck-deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      pages: write
    steps:
      - name: Cancel the deployment that blocks publication
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          endpoint="repos/$GITHUB_REPOSITORY/pages/deployments/207bbeb9a6d0bfb45c2ce715cd277da673a2be27"
          echo 'Status before cancellation:'
          gh api "$endpoint" --jq '.status'
          gh api --method POST "$endpoint/cancel" --silent
          echo 'GitHub accepted the cancellation request.'
          echo 'Status after cancellation:'
          gh api "$endpoint" --jq '.status'
