<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chi tiết — HTX Lúa Di Sản Hội An</title>
<link rel="preconnect" href="https://fonts.googleapis.com/">
<link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
<style>
:root{--nen:#f5f2e8;--nen-2:#efe9d8;--muc:#2b3524;--xanh-dam:#1e4d2b;--xanh-la:#6f9e4b;--xanh-rong:#8bc34a;--dat:#e3d9c4;--dat-som:#b5734a;--vang:#c9a227;--trang:#fffdf8;--xam:#8a9180}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Be Vietnam Pro',system-ui,sans-serif;background:var(--nen);color:var(--muc);line-height:1.6;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:'Playfair Display',Georgia,serif;font-weight:600;line-height:1.15;color:var(--xanh-dam)}
a{color:inherit;text-decoration:none}img{max-width:100%;display:block}
.wrap{max-width:1180px;margin:0 auto;padding:0 22px}
.wrap-hep{max-width:820px;margin:0 auto;padding:0 22px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:2.5px;text-transform:uppercase;color:var(--dat-som)}
.topbar{background:var(--xanh-dam);color:#f3ede0;font-size:12.5px;text-align:center;padding:7px 16px}
.topbar b{color:var(--vang)}
header{position:sticky;top:0;z-index:40;background:var(--trang);border-bottom:1px solid #e4dcc8}
.nav{display:flex;align-items:center;gap:20px;height:72px}
.brand{display:flex;align-items:center;gap:12px}
.brand .logo{width:46px;height:46px;flex:none;object-fit:contain;transition:transform .35s cubic-bezier(.34,1.3,.64,1)}
.brand:hover .logo{transform:rotate(-6deg) scale(1.06)}
.brand .bname{font-family:'Playfair Display',serif;font-weight:700;font-size:18px;color:var(--xanh-dam);line-height:1.05}
.brand .bname small{display:block;font-family:'Be Vietnam Pro',sans-serif;font-weight:400;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--xam)}
.nav .menu{display:flex;gap:28px;margin-left:26px;flex:1}
.nav .menu a{font-size:14.5px;font-weight:500;padding:6px 0;position:relative;color:var(--muc)}
.nav .menu a::after{content:"";position:absolute;left:0;right:100%;bottom:-2px;height:2px;background:var(--dat-som);transition:right .25s}
.nav .menu a:hover::after,.nav .menu a.active::after{right:0}
.nav .menu a.active{color:var(--xanh-dam);font-weight:600}
.nav .acts{display:flex;align-items:center;gap:14px}
.nav .acts .dangnhap{border:1.5px solid var(--xanh-dam);color:var(--xanh-dam);border-radius:22px;padding:8px 16px;font-weight:600;background:none;cursor:pointer;font-family:inherit;font-size:14px}
.nav .acts .dangnhap:hover{background:var(--xanh-dam);color:#fff}
.nav .acts a.icon{position:relative;font-size:14px}
.nav .acts .dem{position:absolute;top:-8px;right:-10px;background:var(--dat-som);color:#fff;font-size:10px;font-weight:700;min-width:17px;height:17px;border-radius:9px;display:flex;align-items:center;justify-content:center}
.burger{display:none;background:none;border:none;font-size:24px;color:var(--xanh-dam);cursor:pointer}
.mau-banner{background:#fff3d6;border-bottom:1px solid #e6cf94;color:#8a5a00;font-size:12.5px;text-align:center;padding:8px 16px}

/* hero chi tiết */
.ct-hero{padding:74px 0 66px;color:#fff}
.ct-hero .lai{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:#dfe9d5;margin-bottom:14px;opacity:.9}
.ct-hero .lai:hover{opacity:1;color:var(--vang)}
.ct-hero h1{color:#fff;font-size:clamp(30px,4.8vw,52px);max-width:19ch;margin:8px 0 14px}
.ct-hero .dan{max-width:58ch;color:#eef3e6;font-size:16.5px}
.ct-hero .so-nhanh{display:flex;gap:34px;flex-wrap:wrap;margin-top:26px}
.ct-hero .sn-o .sn-so{font-family:'Playfair Display',serif;font-size:30px;font-weight:700;color:var(--vang);line-height:1}
.ct-hero .sn-o .sn-nhan{font-size:12.5px;color:#dfe9d5;margin-top:5px}

/* thân bài */
.than{padding:58px 0}
.than h2{font-size:clamp(23px,3vw,32px);margin:0 0 14px}
.khoi{margin-bottom:40px}
.khoi p{font-size:16px;margin-bottom:14px}
.ds{list-style:none;margin-top:6px}
.ds li{font-size:15.5px;padding:9px 0 9px 32px;position:relative;border-bottom:1px dashed #e4dcc4}
.ds li:last-child{border-bottom:none}
.ds li::before{content:"🌾";position:absolute;left:0;top:9px}
.hop-nhan{background:var(--trang);border:1px solid #e6ddc8;border-radius:16px;padding:22px 24px;margin-bottom:22px}
.hop-nhan .hn-tit{font-family:'Playfair Display',serif;font-size:19px;color:var(--xanh-dam);margin-bottom:8px}
.hop-vang{background:#faf6ea;border:1px dashed #d8c48f;border-radius:14px;padding:16px 18px;font-size:14px;color:#6b5a3a}
.hop-vang b{color:var(--dat-som)}

.anh-lon{width:100%;aspect-ratio:16/7;border-radius:18px;overflow:hidden;position:relative;
  background:linear-gradient(135deg,var(--dat),#cdbf9d);border:1px solid #d8cdb0;margin-bottom:36px;
  display:flex;align-items:center;justify-content:center}
.anh-lon .goi-y{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;color:#9a8a63;font-size:13px}
.anh-lon img{position:relative;z-index:2;width:100%;height:100%;object-fit:cover}
.anh-lon img.loi{display:none}

.mua-thanh{background:var(--trang);border:1px solid #e6ddc8;border-radius:18px;padding:22px 24px;
  display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;margin-bottom:36px}
.mua-thanh .gia{font-family:'Playfair Display',serif;font-size:28px;font-weight:700;color:var(--xanh-dam)}
.mua-thanh .gia small{font-family:'Be Vietnam Pro',sans-serif;font-size:12.5px;font-weight:400;color:var(--xam)}
.mua-thanh .nut-mua{background:var(--xanh-dam);color:#fff;border:none;font-family:inherit;font-weight:700;font-size:15px;padding:14px 30px;border-radius:28px;cursor:pointer}
.mua-thanh .nut-phu{background:transparent;border:1.6px solid var(--xanh-dam);color:var(--xanh-dam);font-family:inherit;font-weight:600;font-size:14.5px;padding:13px 24px;border-radius:28px;cursor:pointer;margin-left:10px}

.dieu-huong{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px}
.dieu-huong a{background:var(--xanh-dam);color:#fff;padding:13px 26px;border-radius:26px;font-weight:600;font-size:14.5px}
.dieu-huong a.phu{background:transparent;border:1.6px solid var(--xanh-dam);color:var(--xanh-dam)}

/* xem thêm mục khác cùng loại */
.khac{padding:52px 0 70px;background:var(--nen-2)}
.khac h2{text-align:center;font-size:clamp(22px,2.8vw,30px);margin-bottom:26px}
.khac-luoi{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}
.khac-o{background:var(--trang);border:1px solid #e6ddc8;border-radius:16px;padding:20px 22px;position:relative}
.khac-o .ko-loai{font-size:11px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;color:var(--dat-som)}
.khac-o .ko-ten{font-family:'Playfair Display',serif;font-size:20px;color:var(--xanh-dam);margin:5px 0 4px}
.khac-o .ko-mo{font-size:13.5px;color:#5a6350}

footer{background:#182e1a;color:#c9d3c0;font-size:14px;padding:40px 0 24px}
footer .wrap{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px}
footer .fb{font-family:'Playfair Display',serif;font-size:18px;color:#fff}
footer .fl{display:flex;gap:20px;font-size:13.5px}
footer .fl a{opacity:.85}footer .fl a:hover{opacity:1;color:var(--vang)}

.modal-phu{position:fixed;inset:0;background:rgba(20,28,15,.55);display:none;align-items:center;justify-content:center;z-index:80;padding:16px}
.modal-phu.mo{display:flex}
.modal{background:#fff;width:100%;max-width:420px;border-radius:18px;padding:26px 24px 30px}
.modal h2{font-size:22px;margin-bottom:6px}
.modal p.sub{font-size:13px;color:#6b7263;margin-bottom:16px}
.form-o{margin-bottom:13px}.form-o label{display:block;font-size:12.5px;font-weight:600;margin-bottom:5px;color:#41503a}
.form-o input{width:100%;font-family:inherit;font-size:14px;padding:11px;border:1.5px solid #cfc8b4;border-radius:9px;background:#fdfcf8}
.nut-gui{width:100%;padding:14px;border:none;border-radius:11px;background:var(--xanh-dam);color:#fff;font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;margin-top:4px}
.dong{display:block;margin:14px auto 0;background:none;border:none;color:#8a9180;font-size:13px;cursor:pointer;font-family:inherit}

@media(max-width:760px){.khac-luoi{grid-template-columns:1fr}}
@media(max-width:680px){.nav .menu,.nav .acts .dangnhap span{display:none}.burger{display:block}}
</style>
<link rel="stylesheet" href="css/hieu-ung.css">
<link rel="icon" type="image/png" href="img/favicon.png">
<!-- TOÀN BỘ CHỮ CỦA WEBSITE nằm trong file này. Nạp sớm để trang chi tiết dùng được. -->
<script src="js/noi-dung.js?v=1.0"></script>
</head>
<body>

<header>
  <div class="wrap nav">
    <a href="index.html" class="brand">
      <img src="img/logo.png" class="logo" alt="Logo HTX Lúa Di Sản Hội An" width="46" height="46">
      <span class="bname">HTX Lúa Di Sản<small>Hội An</small></span>
    </a>
    <nav class="menu">
      <a href="index.html">Trang chủ</a>
      <a href="ve-chung-toi.html" id="navVe">Về chúng tôi</a>
      <a href="san-pham.html" id="navSP">Sản phẩm</a>
      <a href="canh-dong.html" id="navCD">Cánh Đồng</a>
    </nav>
    <div class="acts">
      <button class="dangnhap" onclick="moModal('mpDN')"><span>Đăng nhập</span>👤</button>
      <button class="burger" aria-label="Mở menu" aria-expanded="false">☰</button>
    </div>
  </div>
</header>

<div class="mau-banner" data-nd="chung.bangThongBao"></div>
<section class="ct-hero hero-anh" id="ctHero">
  <div class="wrap">
    <a class="lai" id="ctLai" href="index.html">← Quay lại</a>
    <div class="eyebrow" id="ctLoai" style="color:var(--vang)"></div>
    <h1 id="ctTen">Đang tải…</h1>
    <p class="dan" id="ctDan"></p>
    <div class="so-nhanh" id="ctSoNhanh"></div>
  </div>
</section>

<section class="than">
  <div class="wrap-hep" id="ctThan"></div>
</section>

<section class="khac">
  <div class="wrap">
    <h2 id="khacTit">Xem thêm</h2>
    <div class="khac-luoi" id="khacLuoi"></div>
  </div>
</section>

<footer>
  <div class="wrap">
    <div class="fb"><img class="ft-logo" src="img/logo.png" alt="Logo HTX Lúa Di Sản Hội An" width="38" height="38"><span data-nd="chung.tenDayDu"></span></div>
    <div class="fl">
      <a href="index.html">Trang chủ</a>
      <a href="ve-chung-toi.html">Về chúng tôi</a>
      <a href="san-pham.html">Sản phẩm</a>
      <a href="canh-dong.html">Cánh Đồng</a>
    </div>
  </div>
</footer>

<div class="modal-phu" id="mpDN">
  <div class="modal">
    <h2 data-nd="chung.dangNhap.tieuDe"></h2>
    <p class="sub" data-nd="chung.dangNhap.dan"></p>
    <div class="form-o"><label data-nd="chung.dangNhap.nhanUser"></label><input id="dnUser"></div>
    <div class="form-o"><label data-nd="chung.dangNhap.nhanPass"></label><input id="dnPass" type="password"></div>
    <div class="fqt-loi" id="dnLoi" style="color:#b03c2a;font-size:13px;min-height:18px"></div><button class="nut-gui nut-noi" id="dnGui" onclick="dangNhap()" data-nd="chung.dangNhap.nut"></button>
    <button class="dong" onclick="dongModal('mpDN')">Đóng</button>
  </div>
</div>

<script>
/* =====================================================================
   NỘI DUNG 9 TRANG CHI TIẾT KHÔNG CÒN NẰM Ở ĐÂY.
   Toàn bộ chữ đã dời sang  js/noi-dung.js  — mở file đó mà sửa.
   Ở đây chỉ còn phần ghép ba nhóm lại theo địa chỉ trang:
       chi-tiet.html?loai=canh-dong&ma=ong-dang
       chi-tiet.html?loai=gia-tri&ma=minh-bach
       chi-tiet.html?loai=san-pham&ma=gieo-mam
   ===================================================================== */
const ND = window.NOI_DUNG || {};
const TRONG = { nhan:'', ve:'index.html', veChu:'Quay lại', khacTit:'', muc:{} };
const DU_LIEU = {
  'canh-dong': ND.canhDong || TRONG,
  'gia-tri':   ND.giaTri   || TRONG,
  'san-pham':  ND.goi      || TRONG,
};

/* ---------------- dựng trang ---------------- */

const ts = new URLSearchParams(location.search);
const loai = ts.get('loai') || 'canh-dong';
const ma   = ts.get('ma')   || Object.keys((DU_LIEU[loai]||DU_LIEU['canh-dong']).muc)[0];
const nhom = DU_LIEU[loai] || DU_LIEU['canh-dong'];
const m    = nhom.muc[ma]  || nhom.muc[Object.keys(nhom.muc)[0]];

document.title = m.ten + ' — HTX Lúa Di Sản Hội An';
if(nhom.navId) document.getElementById(nhom.navId).classList.add('active');

// hero
const hero = document.getElementById('ctHero');
if(m.anh){
  const bg = document.createElement('img');
  bg.className = 'hero-bg'; bg.src = m.anh; bg.alt = '';
  bg.addEventListener('error', function(){ bg.classList.add('loi'); });
  hero.insertBefore(bg, hero.firstChild);
}
document.getElementById('ctLoai').textContent = nhom.nhan + (m.phu ? ' · ' + m.phu : '');
document.getElementById('ctTen').textContent  = m.ten;
document.getElementById('ctDan').textContent  = m.dan || '';
const lai = document.getElementById('ctLai');
lai.href = nhom.ve; lai.textContent = '← ' + nhom.veChu;
if(m.so){
  document.getElementById('ctSoNhanh').innerHTML = m.so.map(function(s){
    return '<div class="sn-o"><div class="sn-so">'+s[0]+'</div><div class="sn-nhan">'+s[1]+'</div></div>';
  }).join('');
}

// thân bài
let h = '';
/* KHÔNG chèn lại ảnh ở thân bài: cùng tấm ảnh đó đã làm nền hero phía trên,
   để cả hai là lặp. Muốn thêm ảnh MINH HOẠ KHÁC thì đặt m.anhPhu rồi mở
   lại khối dưới đây với biến đó — đừng dùng lại m.anh. */
if(m.gia){
  h += '<div class="mua-thanh"><div><div class="gia">'+m.gia+' <small>'+(m.giaDv||'')+'</small></div>'+
       '<div style="font-size:12.5px;color:var(--xam)">Liên hệ HTX để được tư vấn chi tiết</div></div>'+
       '<div><button class="nut-mua nut-noi" onclick="moFormQuanTam(\''+m.ten.replace(/'/g,"")+'\')">Tôi quan tâm gói này</button></div></div>';
}
(m.than||[]).forEach(function(k){
  h += '<div class="khoi"><h2>'+k.h+'</h2>';
  if(k.p)  h += k.p.map(function(x){return '<p>'+x+'</p>';}).join('');
  if(k.ds) h += '<ul class="ds">'+k.ds.map(function(x){return '<li>'+x+'</li>';}).join('')+'</ul>';
  h += '</div>';
});
const nut = m.nut || [[nhom.ve, nhom.veChu]];
h += '<div class="dieu-huong">'+nut.map(function(n){
       return '<a class="'+(n[2]||'')+'" href="'+n[0]+'">'+n[1]+'</a>';
     }).join('')+'</div>';
document.getElementById('ctThan').innerHTML = h;

// xem thêm mục khác cùng loại
document.getElementById('khacTit').textContent = nhom.khacTit || 'Xem thêm';
document.getElementById('khacLuoi').innerHTML = Object.keys(nhom.muc)
  .filter(function(k){ return k !== ma; })
  .map(function(k){
    const x = nhom.muc[k];
    return '<a class="khac-o the-noi" href="chi-tiet.html?loai='+loai+'&ma='+k+'">'+
      '<div class="ko-loai">'+(x.phu||nhom.nhan)+'</div>'+
      '<div class="ko-ten">'+x.ten+'</div>'+
      '<div class="ko-mo">'+(x.dan||'')+'</div>'+
      '<span class="dau-bam">→</span></a>';
  }).join('');

</script>
<script src="js/chung.js"></script>
<script src="js/form-quan-tam.js"></script>
<script src="js/hieu-ung.js"></script>
</body>
</html>
