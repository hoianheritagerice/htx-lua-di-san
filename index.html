<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HTX Lúa Di Sản Hội An — Gạo hữu cơ, truy xuất từng thửa ruộng</title>
<link rel="preconnect" href="https://fonts.googleapis.com/">
<link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
<style>
/* ============================================================
   BẢN NHÁP TRANG CHỦ — bố cục học theo lotusfoods.com,
   màu & font & chữ chỉnh riêng cho HTX Lúa Di Sản Hội An.
   Ảnh/chữ đều là nội dung MẪU — anh thay bằng nội dung thật.
   Khi chốt, phần CSS này sẽ dời vào css/chung.css.
   ============================================================ */
:root{
  --nen:#f5f2e8;        /* nền giấy dó */
  --nen-2:#efe9d8;      /* nền phụ nhạt hơn */
  --muc:#2b3524;        /* mực — chữ chính */
  --xanh-dam:#1e4d2b;   /* xanh lá đậm — header/footer (đồng bộ bản đồ) */
  --xanh-la:#6f9e4b;    /* xanh lá tươi */
  --xanh-rong:#8bc34a;
  --dat:#e3d9c4;        /* đất */
  --dat-som:#b5734a;    /* terracotta — nhấn */
  --vang:#c9a227;       /* vàng lúa — nhấn phụ */
  --trang:#fffdf8;
  --xam:#8a9180;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Be Vietnam Pro',system-ui,sans-serif;background:var(--nen);color:var(--muc);line-height:1.6;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:'Playfair Display',Georgia,serif;font-weight:600;line-height:1.15;color:var(--xanh-dam)}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
.wrap{max-width:1180px;margin:0 auto;padding:0 22px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:2.5px;text-transform:uppercase;color:var(--dat-som)}

/* ---- thanh thông báo trên cùng ---- */
.ttopbar{background:var(--xanh-dam);color:#f3ede0;font-size:12.5px;text-align:center;padding:7px 16px;letter-spacing:.4px}
.topbar b{color:var(--vang)}

/* ---- header / nav ---- */
header{position:sticky;top:0;z-index:40;background:var(--trang);border-bottom:1px solid #e4dcc8}
.nav{display:flex;align-items:center;gap:20px;height:72px}
.brand{display:flex;align-items:center;gap:12px}
.brand .logo{width:46px;height:46px;flex:none;object-fit:contain;transition:transform .35s cubic-bezier(.34,1.3,.64,1)}
.brand:hover .logo{transform:rotate(-6deg) scale(1.06)}
.brand .bname{font-family:'Playfair Display',serif;font-weight:700;font-size:18px;color:var(--xanh-dam);line-height:1.05}
.brand .bname small{display:block;font-family:'Be Vietnam Pro',sans-serif;font-weight:400;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--xam)}
.nav .menu{display:flex;gap:28px;margin-left:26px;flex:1}
.nav .menu a{font-size:14.5px;font-weight:500;padding:6px 0;position:relative;color:var(--muc)}
.nav .menu a::after{content:"";position:absolute;left:0;right:100%;bottom:-2px;height:2px;background:var(--dat-som);transition:right .25s}
.nav .menu a:hover{color:var(--xanh-dam)}
.nav .menu a:hover::after,.nav .menu a.active::after{right:0}
.nav .menu a.active{color:var(--xanh-dam);font-weight:600}
.nav .acts{display:flex;align-items:center;gap:14px}
.nav .acts button,.nav .acts a.icon{background:none;border:none;cursor:pointer;font-family:inherit;font-size:14px;color:var(--muc);display:flex;align-items:center;gap:6px}
.nav .acts .dangnhap{border:1.5px solid var(--xanh-dam);color:var(--xanh-dam);border-radius:22px;padding:8px 16px;font-weight:600}
.nav .acts .dangnhap:hover{background:var(--xanh-dam);color:#fff}
.gio{position:relative}
.gio .dem{position:absolute;top:-8px;right:-10px;background:var(--dat-som);color:#fff;font-size:10px;font-weight:700;min-width:17px;height:17px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.burger{display:none;background:none;border:none;font-size:24px;color:var(--xanh-dam);cursor:pointer}

/* ---- hero ---- */
.hero{position:relative;background:
   linear-gradient(120deg,rgba(30,77,43,.86),rgba(30,77,43,.35)),
   repeating-linear-gradient(115deg,#3c6b3a 0 3px,#437043 3px 26px);
   color:#fff;overflow:hidden}
.hero .wrap{padding:88px 22px 96px;position:relative;z-index:2}
.hero h1{color:#fff;font-size:clamp(34px,5.4vw,60px);max-width:16ch}
.hero h1 em{font-style:italic;color:var(--vang)}
.hero p{max-width:52ch;margin:22px 0 30px;font-size:17px;color:#eef3e6}
.hero .cta{display:inline-flex;align-items:center;gap:10px;background:var(--vang);color:#2b2410;font-weight:700;padding:15px 28px;border-radius:30px;font-size:15px;transition:transform .15s,background .2s}
.hero .cta:hover{transform:translateY(-2px);background:#dcb42f}
.hero .cta.phu{background:transparent;color:#fff;border:1.6px solid rgba(255,255,255,.6);margin-left:12px}
.hero .cta.phu:hover{background:rgba(255,255,255,.12)}

/* ---- dải mẫu nhắc nhở ---- */
.mau-banner{background:#fff3d6;border-bottom:1px solid #e6cf94;color:#8a5a00;font-size:12.5px;text-align:center;padding:8px 16px}

/* ---- câu chuyện ---- */
.chuyen{padding:76px 0}
.chuyen .grid{display:grid;grid-template-columns:1fr 1fr;gap:52px;align-items:center}
.chuyen .anh{aspect-ratio:5/4;border-radius:16px;background:
   linear-gradient(135deg,var(--dat) 0%,#cdbf9d 100%);
   display:flex;align-items:center;justify-content:center;color:#9a8a63;font-size:14px;text-align:center;padding:20px;border:1px solid #d8cdb0}
.chuyen h2{font-size:clamp(28px,3.6vw,40px);margin:10px 0 16px}
.chuyen p{margin-bottom:16px;font-size:15.5px}
.chuyen .doc-them{display:inline-flex;align-items:center;gap:8px;margin-top:6px;font-weight:600;color:var(--dat-som);border-bottom:2px solid var(--dat-som);padding-bottom:2px}

/* ---- sản phẩm nổi bật ---- */
.sanpham{padding:70px 0;background:var(--nen-2)}
.sec-head{text-align:center;margin-bottom:44px}
.sec-head h2{font-size:clamp(28px,3.6vw,40px);margin-top:8px}
.sp-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:26px}
.sp-card{background:var(--trang);border:1px solid #e6ddc8;border-radius:16px;overflow:hidden;display:flex;flex-direction:column;transition:transform .18s,box-shadow .18s}
.sp-card:hover{transform:translateY(-4px);box-shadow:0 14px 30px rgba(60,50,20,.12)}
.sp-card .hinh{aspect-ratio:1;background:linear-gradient(150deg,#e8dfc7,#d7c9a6);display:flex;align-items:center;justify-content:center;color:#9a8a63;font-size:13px}
.sp-card .than{padding:20px 20px 22px;display:flex;flex-direction:column;flex:1}
.sp-card .goi-ten{font-family:'Playfair Display',serif;font-size:20px;font-weight:600;color:var(--xanh-dam);margin-bottom:6px}
.sp-card .goi-mo{font-size:13.5px;color:#5a6350;flex:1;margin-bottom:16px}
.sp-card .goi-gia{font-weight:700;color:var(--dat-som);font-size:17px;margin-bottom:14px}
.sp-card .goi-gia small{font-weight:400;color:var(--xam);font-size:12px}
.sp-card .them-gio{background:var(--xanh-dam);color:#fff;border:none;font-family:inherit;font-weight:600;font-size:14px;padding:12px;border-radius:10px;cursor:pointer;transition:background .2s}
.sp-card .them-gio:hover{background:#163a20}

/* ---- cộng đồng canh tác ---- */
.congdong{padding:76px 0}
.cd-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:8px}
.cd-card{border-radius:16px;overflow:hidden;position:relative;min-height:280px;display:flex;flex-direction:column;justify-content:flex-end;color:#fff;padding:22px;border:1px solid #d8cdb0}
/* Ảnh thật của cánh đồng làm nền thẻ. Dùng lại đúng 3 file ảnh của trang
   chi tiết (img/dong-*.jpg) — không cần thêm file mới. Thiếu ảnh thì lộ
   nền gradient f1/f2/f3 như cũ, không vỡ layout. */
.cd-card .cd-bg{position:absolute;inset:0;z-index:0;width:100%;height:100%;object-fit:cover;
  transition:transform .5s cubic-bezier(.22,.61,.36,1)}
.cd-card .cd-bg.loi{display:none}
.cd-card::after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;
  background:linear-gradient(180deg,rgba(20,45,25,.10) 0%,rgba(18,42,23,.48) 42%,rgba(12,32,17,.86) 100%)}
.cd-card > *{position:relative;z-index:2}
.cd-card > .cd-bg{z-index:0}
.cd-card:hover .cd-bg{transform:scale(1.07)}
.cd-card.f1{background:linear-gradient(180deg,rgba(30,77,43,.15),rgba(30,77,43,.82)),linear-gradient(135deg,#7fae57,#3c6b3a)}
.cd-card.f2{background:linear-gradient(180deg,rgba(30,77,43,.15),rgba(30,77,43,.82)),linear-gradient(135deg,#c9a227,#8a6d1c)}
.cd-card.f3{background:linear-gradient(180deg,rgba(30,77,43,.15),rgba(30,77,43,.82)),linear-gradient(135deg,#b5734a,#7d4a2b)}
.cd-card h3{color:#fff;font-size:23px;margin-bottom:4px}
.cd-card .cd-vt{font-size:12.5px;letter-spacing:1px;text-transform:uppercase;opacity:.85;margin-bottom:8px}
.cd-card .cd-mo{font-size:13.5px;opacity:.95;margin-bottom:14px}
.cd-card .cd-link{align-self:flex-start;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.5);color:#fff;font-size:13px;font-weight:600;padding:8px 15px;border-radius:20px;backdrop-filter:blur(2px)}
.cd-card .cd-link:hover{background:rgba(255,255,255,.28)}

/* ---- tác động (số liệu thật từ Notion) ---- */
.tacdong{padding:74px 0;background:var(--xanh-dam);color:#eef3e6}
/* Ảnh nền cho mục Tác động — dùng lại cơ chế .hero-anh của css/hieu-ung.css.
   Chỉ đổi lớp phủ: hero phủ đậm bên trái vì chữ căn trái, còn mục này chữ
   căn giữa nên phủ đều trên–dưới, chừa sáng ở khoảng giữa cho thấy ảnh. */
.tacdong.hero-anh::after{
  background:linear-gradient(180deg,
     rgba(14,36,19,.82) 0%,
     rgba(16,42,22,.58) 50%,
     rgba(14,36,19,.82) 100%);
}
.tacdong.hero-anh .so{text-shadow:0 2px 14px rgba(10,26,14,.55)}
.tacdong .sec-head h2{color:#fff}
.tacdong .eyebrow{color:var(--vang)}
.td-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-top:10px}
.td-o{text-align:center;padding:14px}
.td-o .so{font-family:'Playfair Display',serif;font-size:clamp(32px,4vw,48px);font-weight:700;color:var(--vang);line-height:1}
.td-o .nhan{font-size:13px;margin-top:10px;opacity:.9;line-height:1.4}
.td-note{text-align:center;margin-top:26px;font-size:12.5px;opacity:.7}

/* ---- CTA cuối ---- */
.dangky{padding:70px 0;text-align:center}
.dangky h2{font-size:clamp(26px,3.4vw,36px);margin-bottom:12px}
.dangky p{max-width:46ch;margin:0 auto 26px;color:#5a6350}
.dangky .form{display:flex;gap:10px;max-width:440px;margin:0 auto;flex-wrap:wrap;justify-content:center}
.dangky input{flex:1;min-width:220px;font-family:inherit;font-size:15px;padding:14px 16px;border:1.5px solid #cfc8b4;border-radius:28px;background:#fff}
.dangky .form button{background:var(--dat-som);color:#fff;border:none;font-family:inherit;font-weight:700;font-size:15px;padding:14px 28px;border-radius:28px;cursor:pointer}
.dangky .form button:hover{background:#9c5f3c}

/* ---- footer ---- */
footer{background:#182e1a;color:#c9d3c0;font-size:14px;padding:56px 0 26px}
.ft-grid{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:36px;margin-bottom:36px}
.ft-brand .bname{font-family:'Playfair Display',serif;font-size:20px;color:#fff;margin-bottom:10px}
.ft-brand p{font-size:13.5px;opacity:.8;max-width:32ch}
footer h4{color:#fff;font-family:'Be Vietnam Pro',sans-serif;font-size:13px;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:14px}
footer ul{list-style:none}
footer ul li{margin-bottom:9px}
footer ul a{font-size:13.5px;opacity:.85}
footer ul a:hover{opacity:1;color:var(--vang)}
.ft-duoi{border-top:1px solid #2c4430;padding-top:20px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;font-size:12.5px;opacity:.7}

/* ---- modal đăng nhập ---- */
.modal-phu{position:fixed;inset:0;background:rgba(20,28,15,.55);display:none;align-items:center;justify-content:center;z-index:80;padding:16px}
.modal-phu.mo{display:flex}
.modal{background:#fff;width:100%;max-width:420px;border-radius:18px;padding:26px 24px 30px}
.modal h2{font-size:22px;margin-bottom:6px}
.modal p.sub{font-size:13px;color:#6b7263;margin-bottom:16px}
.form-o{margin-bottom:13px}
.form-o label{display:block;font-size:12.5px;font-weight:600;margin-bottom:5px;color:#41503a}
.form-o input{width:100%;font-family:inherit;font-size:14px;padding:11px;border:1.5px solid #cfc8b4;border-radius:9px;background:#fdfcf8}
.nut-gui{width:100%;padding:14px;border:none;border-radius:11px;background:var(--xanh-dam);color:#fff;font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;margin-top:4px}
.dong{display:block;margin:14px auto 0;background:none;border:none;color:#8a9180;font-size:13px;cursor:pointer;font-family:inherit}

/* ---- responsive ---- */
@media(max-width:900px){
  .chuyen .grid,.sp-grid,.cd-grid{grid-template-columns:1fr}
  .td-grid{grid-template-columns:repeat(2,1fr)}
  .ft-grid{grid-template-columns:1fr 1fr}
}
@media(max-width:680px){
  .nav .menu,.nav .acts .dangnhap span{display:none}
  .burger{display:block}
  .nav{gap:12px}
  .ft-grid{grid-template-columns:1fr}
  .hero .wrap{padding:64px 22px 70px}
  .hero .cta.phu{margin-left:0;margin-top:12px}
}
</style>

      </a>

          <div class="goi-ten" data-nd="goi.muc.doi-tac.ten"></div>

</section>

<!-- ===== CỘNG ĐỒNG CANH TÁC ===== -->
<section class="congdong">
  <div class="wrap">
    <div class="sec-head">
      <div class="eyebrow" data-nd="trangChu.congDong.nhan"></div>
      <h2 data-nd="trangChu.congDong.tieuDe"></h2>
    </div>
    <div class="cd-grid">
      <a class="cd-card f1 the-noi" href="chi-tiet.html?loai=canh-dong&ma=ong-dang">
        <img class="cd-bg anh-that" src="img/dong-ong-dang.jpg" alt="Cánh đồng Ông Đảng">
        <div class="cd-vt" data-nd="canhDong.muc.ong-dang.viTri"></div>
