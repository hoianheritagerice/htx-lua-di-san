<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>Nhật ký thửa ruộng — HTX Lúa Di Sản Hội An</title><style>body{margin:0;padding:24px;min-height:90vh;display:grid;place-items:center;background:#f5f2e8;color:#263926;font:16px/1.6 system-ui,sans-serif}main{max-width:440px;padding:32px;background:#fffdf8;border:1px solid #ddd4c2;border-radius:14px;text-align:center}a{color:#286235}</style></head><body><main><h2>Nhật ký thửa ruộng</h2><p id="msg">Đang kiểm tra link của bạn…</p><p><a href="./ban-do.html">Xem bản đồ</a></p></main><script>(async()=>{const m=document.getElementById('msg'),k=new URLSearchParams(location.hash.slice(1)).get('k')||'';if(!/^[A-Za-z0-9_-]{22}$/.test(k)){m.textContent='Link không hợp lệ. Vui lòng liên hệ HTX.';return}try{const r=await fetch('https://script.google.com/macros/s/AKfycbxkBLw-2LGnKPrc0m8cjogwqyv1kCyP5D1hN8A7Pt2IQ6n8QwRGQhD8ea8PAQzOVwjy/exec',{method:'POST',body:JSON.stringify({action:'getLinkAccess',linkKey:k}),cache:'no-store',referrerPolicy:'no-referrer'});if(!r.ok)throw Error('offline');const q=await r.json();if(!q||!q.ok){m.textContent='Link đã hết hiệu lực hoặc bị thu hồi.';return}const f=String(q.field||''),s=String(q.season||''),p=String(q.plot||'');if(!/^(CKOD|CTDC|CTDM)$/.test(f)||!/^[A-Z0-9]+$/.test(s)||!/^[A-Z0-9]+$/.test(p))throw Error('invalid');location.replace('./ban-do.html?'+new URLSearchParams({dong:f,vu:s,'cua-toi':p})+'#ma-xem='+encodeURIComponent(k))}catch(e){m.textContent='Chưa thể mở nhật ký lúc này. Vui lòng thử lại sau.'}})();</script></body></html>
