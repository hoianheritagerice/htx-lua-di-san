<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sản phẩm — HTX Lúa Di Sản Hội An</title>
<link rel="preconnect" href="https://fonts.googleapis.com/">
<link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
<style>
:root{--nen:#f5f2e8;--nen-2:#efe9d8;--muc:#2b3524;--xanh-dam:#1e4d2b;--xanh-la:#6f9e4b;--xanh-rong:#8bc34a;--dat:#e3d9c4;--dat-som:#b5734a;--vang:#c9a227;--trang:#fffdf8;--xam:#8a9180}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Be Vietnam Pro',system-ui,sans-serif;background:var(--nen);color:var(--muc);line-height:1.6;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:'Playfair Display',Georgia,serif;font-weight:600;line-height:1.15;color:var(--xanh-dam)}
a{color:inherit;text-decoration:none}img{max-width:100%;display:block}
.wrap{max-width:1180px;margin:0 auto;padding:0 22px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:2.5px;text-transform:uppercase;color:var(--dat-som)}
.topbar{background:var(--xanh-dam);color:#f3ede0;font-size:12.5px;text-align:center;padding:7px 16px}
.topbar b{color:var(--vang)}
header{position:sticky;top:0;z-index:40;background:var(--trang);border-bottom:1px solid #e4dcc8}
.nav{display:flex;align-items:center;gap:20px;height:72px}
.brand{display:flex;align-items:center;gap:12px}
.brand .logo{width:46px;height:46px;flex:none;object-fit:contain;transition:transform .35s cubic-bezier(.34,1.3,.64,1)}
.brand:hover .logo{transform:rotate(-6deg) scale(1.06)}
.brand .bname{font-family:'Playfair Display',serif;font-weight:700;font-size:18px;color:var(--xanh-dam);line-height:1.05}
.brand .bname small{display:block;font-family:'Be Vietnam Pro',sans-serif;font-weight:400;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--xam)}
.nav .menu{display:flex;gap:28px;margin-left:26px;flex:1}
.nav .menu a{font-size:14.5px;font-weight:500;padding:6px 0;position:relative;color:var(--muc)}
.nav .menu a::after{content:"";position:absolute;left:0;right:100%;bottom:-2px;height:2px;background:var(--dat-som);transition:right .25s}
.nav .menu a:hover::after,.nav .menu a.active::after{right:0}
.nav .menu a.active{color:var(--xanh-dam);font-weight:600}
.nav .acts{display:flex;align-items:center;gap:14px}
.nav .acts .dangnhap{border:1.5px solid var(--xanh-dam);color:var(--xanh-dam);border-radius:22px;padding:8px 16px;font-weight:600;background:none;cursor:pointer;font-family:inherit;font-size:14px}
.nav .acts .dangnhap:hover{background:var(--xanh-dam);color:#fff}
.nav .acts a.icon{position:relative;font-size:14px}
.nav .acts .dem{position:absolute;top:-8px;right:-10px;background:var(--dat-som);color:#fff;font-size:10px;font-weight:700;min-width:17px;height:17px;border-radius:9px;display:flex;align-items:center;justify-content:center}
.burger{display:none;background:none;border:none;font-size:24px;color:var(--xanh-dam);cursor:pointer}
.mau-banner{background:#fff3d6;border-bottom:1px solid #e6cf94;color:#8a5a00;font-size:12.5px;text-align:center;padding:8px 16px}

.shero{background:linear-gradient(120deg,rgba(30,77,43,.9),rgba(30,77,43,.5)),repeating-linear-gradient(115deg,#3c6b3a 0 3px,#437043 3px 26px);color:#fff;padding:60px 0 52px}
.shero h1{color:#fff;font-size:clamp(32px,5vw,52px);max-width:18ch}
.shero p{max-width:56ch;margin-top:16px;color:#eef3e6;font-size:16.5px}

.goi-sec{padding:56px 0}
.goi{display:grid;grid-template-columns:0.9fr 1.1fr;gap:38px;align-items:center;background:var(--trang);border:1px solid #e6ddc8;border-radius:20px;padding:30px;margin-bottom:30px}
.goi:nth-child(even){grid-template-columns:1.1fr 0.9fr}
.goi:nth-child(even) .goi-hinh{order:2}
.goi-hinh{aspect-ratio:4/3;border-radius:14px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;font-weight:600;text-align:center;padding:18px}
.goi:nth-child(1) .goi-hinh{background:linear-gradient(140deg,#7fae57,#3c6b3a)}
.goi:nth-child(2) .goi-hinh{background:linear-gradient(140deg,#c9a227,#8a6d1c)}
.goi:nth-child(3) .goi-hinh{background:linear-gradient(140deg,#b5734a,#7d4a2b)}
.goi-tag{font-size:11.5px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--dat-som)}
.goi h2{font-size:clamp(24px,3vw,32px);margin:6px 0 10px}
.goi .mo{font-size:15px;color:#4d5643;margin-bottom:16px}
.goi ul{list-style:none;margin-bottom:18px}
.goi ul li{font-size:14.5px;padding:6px 0 6px 28px;position:relative}
.goi ul li::before{content:"🌾";position:absolute;left:0;top:5px;font-size:14px}
.goi .hoatdong{font-size:12.5px;color:#6b5a3a;background:#faf6ea;border:1px dashed #d8c48f;border-radius:10px;padding:10px 13px;margin-bottom:18px}
.goi .hoatdong b{color:var(--dat-som)}
.goi .gia-hang{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.goi .gia{font-family:'Playfair Display',serif;font-size:26px;font-weight:700;color:var(--xanh-dam)}
.goi .gia small{font-family:'Be Vietnam Pro',sans-serif;font-size:12px;font-weight:400;color:var(--xam)}
.goi .them-gio{background:var(--xanh-dam);color:#fff;border:none;font-family:inherit;font-weight:600;font-size:14.5px;padding:13px 24px;border-radius:26px;cursor:pointer}
.goi .them-gio:hover{background:#163a20}

/* bảng đối chiếu gói × hoạt động mùa vụ */
.doi-chieu{padding:60px 0;background:var(--nen-2)}
.doi-chieu .sec-head{text-align:center;max-width:640px;margin:0 auto 30px}
.doi-chieu .sec-head h2{font-size:clamp(26px,3.4vw,36px);margin-top:8px}
.dc-table{max-width:820px;margin:0 auto;background:var(--trang);border:1px solid #e6ddc8;border-radius:16px;overflow:hidden}
.dc-row{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;border-bottom:1px solid #ece5d2}
.dc-row:last-child{border-bottom:none}
.dc-row.head{background:var(--xanh-dam);color:#fff;font-weight:600;font-size:12.5px}
.dc-row.head>div{text-align:center}
.dc-row.head>div:first-child{text-align:left}
.dc-cell{padding:13px 14px;font-size:13.5px;display:flex;align-items:center;justify-content:center}
.dc-cell:first-child{justify-content:flex-start;font-weight:600;color:var(--xanh-dam);font-size:13px}
.dc-cell .yes{color:var(--xanh-la);font-size:18px;font-weight:700}
.dc-cell .no{color:#cfc8b4;font-size:16px}
.dc-note{text-align:center;font-size:12.5px;color:var(--xam);margin-top:16px}

footer{background:#182e1a;color:#c9d3c0;font-size:14px;padding:40px 0 24px}
footer .wrap{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px}
footer .fb{font-family:'Playfair Display',serif;font-size:18px;color:#fff}
footer .fl{display:flex;gap:20px;font-size:13.5px}
footer .fl a{opacity:.85}footer .fl a:hover{opacity:1;color:var(--vang)}

.modal-phu{position:fixed;inset:0;background:rgba(20,28,15,.55);display:none;align-items:center;justify-content:center;z-index:80;padding:16px}
.modal-phu.mo{display:flex}
.modal{background:#fff;width:100%;max-width:420px;border-radius:18px;padding:26px 24px 30px}
.modal h2{font-size:22px;margin-bottom:6px}
.modal p.sub{font-size:13px;color:#6b7263;margin-bottom:16px}
.form-o{margin-bottom:13px}.form-o label{display:block;font-size:12.5px;font-weight:600;margin-bottom:5px;color:#41503a}
.form-o input{width:100%;font-family:inherit;font-size:14px;padding:11px;border:1.5px solid #cfc8b4;border-radius:9px;background:#fdfcf8}
.nut-gui{width:100%;padding:14px;border:none;border-radius:11px;background:var(--xanh-dam);color:#fff;font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;margin-top:4px}
.dong{display:block;margin:14px auto 0;background:none;border:none;color:#8a9180;font-size:13px;cursor:pointer;font-family:inherit}

@media(max-width:820px){.goi,.goi:nth-child(even){grid-template-columns:1fr}.goi:nth-child(even) .goi-hinh{order:0}.dc-row{grid-template-columns:1.6fr .8fr .8fr .8fr}}
@media(max-width:680px){.nav .menu,.nav .acts .dangnhap span{display:none}.burger{display:block}.dc-cell{padding:10px 6px;font-size:12px}}
</style>
